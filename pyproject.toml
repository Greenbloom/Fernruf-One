[project]
name = "fernruf"
version = "0.1.0"
description = "AI phone calls for agents, via your own SIP line"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Greenbloom", email = "53740246+Greenbloom@users.noreply.github.com" }]
requires-python = ">=3.12"
dependencies = [
  "audioop-lts>=0.2.2; python_version >= '3.13'",
  "aiohttp>=3.14.5",
  "click>=8.1",
  "fastapi>=0.162.0",
  "faster-whisper>=1.2.1",
  "httpx>=0.28",
  "numpy>=2.5.4",
  "pillow>=12",
  "openai>=3.37.0",
  "pipecat-ai[silero]>=1.14.0",
  "pipecat-asterisk>=0.1.4",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "scipy>=1.18.1",
  "uvicorn>=0.54.0",
  "websockets>=14.0",
  "mcp>=2.3.0",
]

[project.optional-dependencies]
desktop = [
  "PySide6>=6.8",
]
cuda = [
  "nvidia-cublas-cu12>=12.4.5.8; sys_platform == 'linux'",
  "nvidia-cudnn-cu12>=9.1.0.70; sys_platform == 'linux'",
]

[project.urls]
Repository = "https://github.com/Greenbloom/Fernruf-One"
Issues = "https://github.com/Greenbloom/Fernruf-One/issues"

[project.scripts]
fernruf = "fernruf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fernruf"]

[tool.hatch.build.targets.wheel.force-include]
"fernruf/desktop/MonitorPlaceholder.qml" = "fernruf/desktop/MonitorPlaceholder.qml"
"fernruf/desktop/i18n/fernruf_de.ts" = "fernruf/desktop/i18n/fernruf_de.ts"
"fernruf/desktop/i18n/fernruf_de.qm" = "fernruf/desktop/i18n/fernruf_de.qm"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["fernruf", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# E501: spoken prompts and guides are long strings on purpose.
# UP042: str+Enum is the existing behavior. StrEnum would change formatting.
# UP031: one test embeds a script that already contains braces.
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/test_desktop_i18n.py" = ["UP031"]

[tool.ruff.lint.isort]
known-first-party = ["fernruf"]
