[project]
name = "fernruf"
version = "0.1.0"
description = "AI phone calls for agents, via your own SIP line"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "audioop-lts>=0.2.2; python_version >= '3.13'",
  "aiohttp>=3.14.5",
  "click>=8.1",
  "fastapi>=0.162.0",
  "faster-whisper>=1.2.1",
  "httpx>=0.28",
  "numpy>=2.5.4",
  "pillow>=12",
  "openai>=3.37.0",
  "pipecat-ai[silero]>=1.14.0",
  "pipecat-asterisk>=0.1.4",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "scipy>=1.18.1",
  "uvicorn>=0.54.0",
  "websockets>=14.0",
  "mcp>=2.3.0",
]

[project.optional-dependencies]
cuda = [
  "nvidia-cublas-cu12>=12.4.5.8; sys_platform == 'linux'",
  "nvidia-cudnn-cu12>=9.1.0.70; sys_platform == 'linux'",
]

[project.scripts]
fernruf = "fernruf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fernruf"]

[dependency-groups]
dev = [
  "pytest>=8.3",
]
