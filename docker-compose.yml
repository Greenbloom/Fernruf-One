# Host networking keeps SIP/RTP on the LAN without double NAT.
services:
  asterisk:
    build:
      context: ./docker/asterisk
      args:
        ASTERISK_IMAGE: andrius/asterisk:22
    image: fernruf-asterisk:22.11
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      SIP_HOST: ${SIP_HOST:-192.0.2.1}
      SIP_IP: ${SIP_IP:-192.0.2.1}
      SIP_PORT: ${SIP_PORT:-5060}
      PJSIP_REG_EXPIRATION: ${PJSIP_REG_EXPIRATION:-300}
      PJSIP_QUALIFY_FREQUENCY: ${PJSIP_QUALIFY_FREQUENCY:-60}
      SIP_USER: ${SIP_USER:-}
      SIP_PASSWORD: ${SIP_PASSWORD:-}
      LAN_CIDR: ${LAN_CIDR:-192.0.2.0/24}
      ASTERISK_ARI_USER: ${ASTERISK_ARI_USER:-fernruf}
      ASTERISK_ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:?set ASTERISK_ARI_PASSWORD in .env}
      FERNRUF_CALLER_ID_NAME: ${FERNRUF_CALLER_ID_NAME:-Fernruf}
      FERNRUF_CALLER_ID_NUMBER: ${FERNRUF_CALLER_ID_NUMBER:-100}
      FERNRUF_WS_URI: ${FERNRUF_WS_URI:-ws://127.0.0.1:8765/media}
    volumes:
      - ./data/asterisk-sounds:/var/lib/asterisk/sounds/custom
      - ./data/asterisk-generated:/etc/asterisk/generated
    restart: unless-stopped

  # Host network so the app can bind 127.0.0.1 alongside Asterisk on the same machine.
  fernruf:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    network_mode: host
    working_dir: /srv/fernruf
    volumes:
      - .:/srv/fernruf
    env_file:
      - path: .env
        required: false
    environment:
      FERNRUF_BIND_HOST: ${FERNRUF_BIND_HOST:-127.0.0.1}
      FERNRUF_BIND_PORT: ${FERNRUF_BIND_PORT:-8787}
    command: ["uv", "run", "fernruf", "serve"]
    restart: unless-stopped
    depends_on:
      - asterisk
