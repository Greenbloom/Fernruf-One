[fernruf-demo]
; Local AI-to-AI demo. This context never dials the SIP trunk.
exten => _600-.,1,NoOp(Fernruf demo callee ${EXTEN})
 same => n,Answer()
 same => n,Set(AUDIOHOOK_INHERIT(MixMonitor)=yes)
 same => n,MixMonitor(/var/spool/asterisk/monitor/${EXTEN:4}.wav)
 same => n,Dial(WebSocket/fernruf-callee/c(slin16)f(json)d(both))
 same => n,Hangup()
exten => h,1,StopMixMonitor()
