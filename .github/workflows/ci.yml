name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --group dev --extra desktop
      - name: Qt offscreen libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 libfontconfig1 libxcb1
      - run: uv run pytest -q
      - name: Verify .env.verify policy pchecks
        run: |
          chmod +x scripts/verify/run_policy_pchecks.sh
          ./scripts/verify/run_policy_pchecks.sh

  sipp-scenario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: SIPp loopback (UAS + UAC REGISTER/INVITE)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sip-tester
          uv sync --group dev
          chmod +x scripts/verify/check_sipp_scenario.sh
          ./scripts/verify/check_sipp_scenario.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.24.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp
          sudo install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan repository history
        run: gitleaks detect --source . --no-banner --redact
