name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Install Python
        run: uv python install 3.12

      - name: Export locked requirements
        run: uv export --frozen --all-extras --all-groups --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt" >/dev/null

      - name: Audit locked dependencies
        run: |
          set -euo pipefail
          mapfile -t ids < <(uv run --python 3.12 --no-project python scripts/security/pip_audit_ignores.py .github/security/pip-audit-ignores.toml)
          cmd=(
            uvx --python 3.12 pip-audit==2.10.1
            -r "$RUNNER_TEMP/requirements.txt"
            --progress-spinner off
            --disable-pip
          )
          for vuln_id in "${ids[@]}"; do
            if [ -n "$vuln_id" ]; then
              cmd+=(--ignore-vuln "$vuln_id")
            fi
          done
          "${cmd[@]}"

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
          build-mode: none
          queries: code-scanning

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:python"
          output: ${{ github.workspace }}/codeql-sarif

      - name: Fail on CodeQL findings
        run: python3 scripts/security/fail_on_codeql_sarif.py "${{ github.workspace }}/codeql-sarif"
