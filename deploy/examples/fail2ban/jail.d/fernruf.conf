[fernruf-nginx]
enabled = true
filter = fernruf-nginx
logpath = /var/log/nginx/fernruf.access.log
maxretry = 5
findtime = 300
bantime = 900

[fernruf-journal]
enabled = true
filter = fernruf-journal
backend = systemd
journalmatch = _SYSTEMD_UNIT=fernruf.service
maxretry = 5
findtime = 300
bantime = 900
