# Example reverse proxy for fernruf.example.com → Fernruf MCP (127.0.0.1:8787).
# TLS: certbot / Let's Encrypt (/etc/letsencrypt/live/fernruf.example.com/).

limit_req_zone $binary_remote_addr zone=fernruf_mcp:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=fernruf_oauth:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name fernruf.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fernruf.example.com;

    ssl_certificate /etc/letsencrypt/live/fernruf.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fernruf.example.com/privkey.pem;

    client_max_body_size 64k;

    location /.well-known/ {
        limit_req zone=fernruf_oauth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 75s;
    }

    location = /register {
        limit_req zone=fernruf_oauth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 75s;
    }

    location = /authorize {
        limit_req zone=fernruf_oauth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 75s;
    }

    location = /token {
        limit_req zone=fernruf_oauth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 75s;
    }

    location = /oauth/github/callback {
        limit_req zone=fernruf_oauth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 75s;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 75s;
    }

    location /mcp {
        limit_req zone=fernruf_mcp burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        return 404;
    }
}

# Do not expose other services on this host (for example port 8080) via this vhost.
